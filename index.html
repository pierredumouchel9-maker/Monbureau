<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon Bureau</title>
<meta name="theme-color" content="#2f5d8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mon Bureau">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f5f2;--panel:#ffffff;--ink:#1f2328;--muted:#646b73;--line:#dedbd4;
  --accent:#2f5d8a;--accent-soft:#e7eef6;--danger:#b3261e;--danger-soft:#fbebeb;
  --ok:#2e7d32;--warn:#a15c00;--warn-soft:#fdf1dc;--radius:10px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#16181b;--panel:#1f2226;--ink:#e8e6e3;--muted:#a1a7ae;--line:#33373c;
  --accent:#7fb0e0;--accent-soft:#22313f;--danger:#ff8a80;--danger-soft:#3a2222;--warn:#f0b35a;--warn-soft:#3a2f1c}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.hidden{display:none!important}

/* Écran de verrouillage */
#lock{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.lock-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px;width:100%;max-width:420px}
.lock-card h1{margin:0 0 4px;font-size:24px}
.lock-card p{color:var(--muted);margin:0 0 20px}
.lock-logo{width:56px;height:56px;margin-bottom:16px}

/* Mise en page principale */
#app{display:flex;min-height:100%}
#sidebar{width:240px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
#sidebar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:4px 8px 16px}
#sidebar .brand img{width:28px;height:28px}
#sidebar .group{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:14px 10px 4px}
#sidebar a.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none}
#sidebar a.nav:hover{background:var(--bg)}
#sidebar a.nav.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
#sidebar a.nav .ico{width:20px;text-align:center}
#sidebar a.nav.soon{color:var(--muted)}
#sidebar a.nav .tag{margin-left:auto;font-size:11px;color:var(--muted)}
#sidebar .spacer{flex:1}
#main{flex:1;min-width:0;padding:28px 32px 64px}
#topbar{display:none}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{margin:0;font-size:24px}
.page-head p{margin:4px 0 0;color:var(--muted)}
@media (max-width:820px){
  #sidebar{position:fixed;z-index:30;left:0;top:0;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  #sidebar.open{transform:none}
  #topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
  #app{flex-direction:column}
  #main{padding:20px 16px 64px}
}

/* Composants */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.stat{font-size:28px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#111}}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:default}
label.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.field>span{font-weight:600}
input[type=text],input[type=password],input[type=email],input[type=tel],input[type=number],input[type=search],input[type=date],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 11px;color:var(--ink)}
input:focus,select:focus,textarea:focus,[contenteditable]:focus{outline:2px solid var(--accent);outline-offset:1px}
.form-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.form-grid .wide{grid-column:1/-1}
table.list{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
table.list th,table.list td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.list th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--bg)}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:var(--accent-soft)}
.table-wrap{overflow:auto}
/* Tableaux longs : titres et première colonne toujours visibles pendant le défilement */
.table-wrap.sticky{max-height:calc(100vh - 100px);border:1px solid var(--line);border-radius:var(--radius)}
.table-wrap.sticky table.list{overflow:visible;border:0;border-radius:0}
.table-wrap.sticky thead th{position:sticky;top:0;z-index:3;background:var(--panel);box-shadow:0 1px 0 var(--line)}
.table-wrap.sticky tbody td:first-child{position:sticky;left:0;z-index:1;background:inherit}
.table-wrap.sticky tbody tr:not([style*="background"]) td:first-child{background:var(--panel)}
.table-wrap.sticky thead th:first-child{left:0;z-index:4}
/* Colonne de pointage S-21 devant le nom : les deux restent visibles */
th.s21,td.s21{width:44px;min-width:44px;max-width:44px;text-align:center;padding-left:4px!important;padding-right:4px!important}
td.s21 input{width:18px;height:18px;cursor:pointer;accent-color:#2f7d4f}
.table-wrap.sticky tbody td.s21+td{position:sticky;left:44px;z-index:1;background:inherit}
.table-wrap.sticky tbody tr:not([style*="background"]) td.s21+td{background:var(--panel)}
.table-wrap.sticky thead th.s21+th{position:sticky;left:44px;z-index:4}
/* Fonction, épouse et responsabilités sous le nom : toujours lisibles, même en défilant vers la droite */
#pTab td.s21+td{min-width:210px;max-width:250px}
#pTab .fct-box{margin-top:6px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
#pTab .fct-box select{font-size:12.5px;padding:3px 6px!important;max-width:220px;color:#1f2328;background:#fff}
#pTab .fct-box > div{margin:0!important}
.pill{display:inline-block;white-space:nowrap;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.notice{border-radius:8px;padding:10px 14px;background:var(--accent-soft)}
.notice.warn{background:var(--warn-soft)}
.notice.danger{background:var(--danger-soft);color:var(--danger)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:0;background:none;padding:9px 14px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted)}
.tabs button.active{border-color:var(--accent);color:var(--accent);font-weight:600}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--panel);color:var(--ink);width:min(720px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog .d-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
dialog .d-head h2{margin:0;font-size:18px}
dialog .d-body{padding:20px;overflow:auto;max-height:calc(90vh - 130px)}
dialog .d-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line)}
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.error{background:var(--danger);color:#fff}
.secret{font-family:ui-monospace,Menlo,monospace;letter-spacing:.04em}

/* Éditeur de modèles */
.editor-bar{display:flex;gap:4px;flex-wrap:wrap;padding:6px;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:var(--bg)}
.editor-bar .btn{padding:4px 10px}
.editor{min-height:420px;border:1px solid var(--line);border-radius:0 0 8px 8px;background:#fff;color:#1f2328;padding:40px 48px;font:14px/1.5 Helvetica,Arial,sans-serif}
.editor h2{font-size:18px;margin:.4em 0}.editor h3{font-size:15px;margin:.4em 0}.editor p{margin:0 0 .5em}
.field-chip{display:inline-block;background:#e7eef6;color:#2f5d8a;border-radius:4px;padding:0 4px;font-size:.92em;white-space:nowrap}
.preview-frame{width:100%;height:560px;border:1px solid var(--line);border-radius:8px;background:#fff}
</style>
</head>
<body>
<div id="lock" class="hidden"></div>
<div id="app" class="hidden">
  <header id="topbar">
    <button class="btn ghost" id="menuBtn" aria-label="Menu">☰</button>
    <strong>Mon Bureau</strong>
    <span class="spacer" style="flex:1"></span>
    <button class="btn small" data-action="lock">🔒</button>
  </header>
  <nav id="sidebar"></nav>
  <main id="main"></main>
</div>
<div id="toasts"></div>
<script src="lib/pdf-lib.min.js"></script>
<script src="js/core.js"></script>
<script src="js/files.js"></script>
<script src="js/pdf.js"></script>
<script src="js/sync.js"></script>
<script src="js/organigramme.js"></script>
<script src="js/s13.js"></script>
<script src="js/mailer.js"></script>
<script src="js/skills/accueil.js"></script>
<script src="js/skills/annuaire.js"></script>
<script src="js/skills/modeles.js"></script>
<script src="js/skills/coffre.js"></script>
<script src="js/skills/sauvegarde.js"></script>
<script src="js/skills/parametres.js"></script>
<script src="js/skills/gestion-skills.js"></script>
<script src="js/skills/circonscription.js"></script>
<script src="js/skills/itineraire.js"></script>
<script src="js/skills/territoires.js"></script>
<script src="js/skills/a-venir.js"></script>
<script>App.start();</script>
</body>
</html>
